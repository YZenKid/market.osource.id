<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>market.osource.id Desktop</title>
    <style>
      :root {
        color: #1f2937;
        background: #f8f6f0;
        font-family: Inter, Geist, "Plus Jakarta Sans", system-ui, sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
      }

      main {
        box-sizing: border-box;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px;
      }

      section {
        max-width: 720px;
        border: 1px solid #d7ddd9;
        border-radius: 24px;
        background: #fff;
        padding: 32px;
        box-shadow: 0 18px 40px -28px rgb(15 23 42 / 0.35);
      }

      p.kicker {
        color: #0e7176;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.2em;
        text-transform: uppercase;
      }

      h1 {
        margin: 12px 0;
        font-size: clamp(28px, 5vw, 44px);
      }

      p {
        line-height: 1.65;
      }
    </style>
  </head>
  <body>
    <main>
      <section>
        <p class="kicker">Desktop supervisor scaffold</p>
        <h1>market.osource.id local control panel</h1>
        <p>
          Tauri shell ini akan menjadi process supervisor untuk bundled PostgreSQL, backend Axum, web UI, dan cloudflared opt-in. Business logic tetap berada di backend.
        </p>
      </section>
    </main>
  </body>
</html>
