services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: market_osource
      POSTGRES_USER: market
      POSTGRES_PASSWORD: market-dev-change-me
    ports:
      - "127.0.0.1:${HOST_POSTGRES_PORT:-7302}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U market -d market_osource"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      RUNTIME_MODE: vps
      BIND_ADDR: 0.0.0.0:8080
      BASE_URL: ${BACKEND_BASE_URL:-http://127.0.0.1:7301}
      DATABASE_URL: postgres://market:market-dev-change-me@postgres:5432/market_osource
      STORAGE_PATH: /var/lib/market-osource/storage
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://127.0.0.1:7300,http://127.0.0.1:7301}
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
      RUST_LOG: info,tower_http=info
    ports:
      - "${HOST_BACKEND_PORT:-7301}:8080"
    volumes:
      - app_storage:/var/lib/market-osource/storage
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    build:
      context: .
      target: web-runtime
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      ORIGIN: ${WEB_ORIGIN:-http://127.0.0.1:7300}
      # Keep API base empty by default so browser requests stay same-origin
      # behind public reverse proxies like https://market.hapfor.cloud.
      PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-}
    ports:
      - "${HOST_WEB_PORT:-7300}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then((r) => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  app_storage:
