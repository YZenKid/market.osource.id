services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: market_osource
      POSTGRES_USER: market
      POSTGRES_PASSWORD: market-dev-change-me
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U market -d market_osource"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      RUNTIME_MODE: vps
      BIND_ADDR: 0.0.0.0:8080
      BASE_URL: http://127.0.0.1:8080
      DATABASE_URL: postgres://market:market-dev-change-me@postgres:5432/market_osource
      STORAGE_PATH: /var/lib/market-osource/storage
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:8080
      COOKIE_SECURE: "false"
      RUST_LOG: info,tower_http=info
    ports:
      - "8080:8080"
    volumes:
      - app_storage:/var/lib/market-osource/storage
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  app_storage:
