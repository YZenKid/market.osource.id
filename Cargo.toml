[workspace]
resolver = "2"
members = [
  "apps/backend",
  "apps/desktop/src-tauri",
  "crates/core-domain",
  "crates/core-app",
  "crates/core-api",
  "crates/core-auth",
  "crates/core-db",
  "crates/core-storage",
  "crates/core-runtime",
  "crates/core-installer",
  "crates/core-packages",
  "crates/sidecar-postgres",
  "crates/sidecar-cloudflared",
]

[workspace.package]
edition = "2021"
license = "AGPL-3.0-or-later"
repository = "https://github.com/YZenKid/market.osource.id"
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1.0"
argon2 = "0.5"
async-trait = "0.1"
axum = { version = "0.8", features = ["macros", "multipart"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
config = "0.15"
core-app = { path = "crates/core-app" }
core-api = { path = "crates/core-api" }
core-auth = { path = "crates/core-auth" }
core-db = { path = "crates/core-db" }
core-domain = { path = "crates/core-domain" }
core-installer = { path = "crates/core-installer" }
core-packages = { path = "crates/core-packages" }
core-runtime = { path = "crates/core-runtime" }
core-storage = { path = "crates/core-storage" }
directories = "6.0"
hex = "0.4"
http = "1.2"
hyper = "1.5"
mime = "0.3"
rand = "0.8"
regex = "1.11"
secrecy = { version = "0.10", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sidecar-cloudflared = { path = "crates/sidecar-cloudflared" }
sidecar-postgres = { path = "crates/sidecar-postgres" }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
tauri = { version = "2", features = [] }
thiserror = "2.0"
tokio = { version = "1.43", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "fs", "limit", "request-id", "sensitive-headers", "set-header", "trace", "util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1.12", features = ["v4", "serde"] }
zeroize = "1.8"
